<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión — Huellitas</title>
    <link rel="shortcut icon" href="../imgs/pets.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div class="top-bar">
            <div class="top-bar-slide">🐾 ¡Bienvenido de vuelta a Huellitas!</div>
        </div>

        <nav class="navbar">
            <div class="navbar-inner">
                <a href="../index.html"><img src="../imgs/logo.png" alt="Huellitas" height="40"></a>
                <div class="nav-actions nav-actions--right">

                    <a href="register.html" class="nav-link">¿No tenés cuenta? Registrate</a>
                </div>
            </div>
        </nav>

    </header>

    <main>
        <div class="form-page">
            <div class="form-card">
                <h2 class="form-title">Iniciá sesión</h2>
                <p class="form-subtitle">Accedé a tu cuenta y tus pedidos</p>

                <form onsubmit="validarLogin(event)">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="tu@email.com" />
                        <span class="form-error" id="err-email">Ingresá un email válido.</span>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="Tu contraseña" />
                        <span class="form-error" id="err-password">Ingresá tu contraseña.</span>
                    </div>

                    <a href="recuperar.html" class="forgot-link form-link">¿Olvidaste tu contraseña?</a>

                    <div class="form-check">
                        <input type="checkbox" id="recordar" />
                        <label for="recordar">Recordar mi sesión</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-full btn-submit">Iniciar sesión</button>

                    <div class="form-divider"><span>o ingresá con</span></div>

                    <button type="button" class="btn-google">
                        <span class="google-icon">G</span> Continuar con Google
                    </button>

                </form>

                <p class="form-footer">¿No tenés cuenta? <a href="register.html" class="form-link">Registrate gratis</a>
                </p>
            </div>
        </div>
    </main>


</body>

</html>
